[package]
name = "key-stream"
description = "A library for async key streaming."
authors = ["Artsiom Kaltovich <kaltovichartyom@gmail.com>"]
version = "0.11.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/artsiomkaltovich/key-stream"

[dependencies]
futures = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread"] }
futures = { version = "0.3", features = ["alloc"] }
criterion = { version = "0.8", features = ["async_tokio"] }
static_assertions = "1"

[[bench]]
name = "key_stream"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
