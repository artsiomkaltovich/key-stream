name: Benchmarks

# Cross-architecture check. Local development happens on arm64 (Apple Silicon);
# these runners are x86_64, where the cost of an atomic RMW is dominated by the
# `lock` prefix rather than by memory ordering.
#
# ONE RUN, ONE ARTIFACT SET. The bench measures three send variants in a single
# pass with per-pass rotation: `guard_held` (guard spans the broadcast — unsafe,
# baseline only), `rc_sender`, and `arc_sender`. There is no feature flag and no
# second configuration; everything needed for the rc-vs-arc decision comes out of
# one file.
#
# An earlier layout ran two feature configs as a `strategy.matrix`, which put them
# on different runners and silently destroyed comparability — `send_no_receivers`
# is byte-identical in both builds and reproduces to 0.01 ns locally, but read
# 23.0 and 12.2 ns across two jobs. `lock`-op latency varies several-fold across
# GitHub's CPU pool, so cross-job comparison is meaningless. Keep it one job.
#
# READ THE NUMBERS WITH CARE even so. Shared VMs are noisy; run-to-run spread
# here is far worse than on a quiet laptop. Use `min`, and treat this as
# confirmation of large directional effects rather than a way to resolve
# sub-nanosecond differences.

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Artifacts are written OUTSIDE the checkout. Writing them into the repo
      # made `git status --porcelain` non-empty, so every run self-reported as
      # `-dirty` — inverting the meaning of a marker whose entire job is to warn
      # that the measured code does not match the recorded commit.
      - name: Prepare output dir
        run: echo "OUT=$RUNNER_TEMP/bench" >> "$GITHUB_ENV"

      - name: Record machine
        run: |
          mkdir -p "$OUT"
          {
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            echo "nproc=$(nproc)"
            echo "---"
            lscpu || true
          } | tee "$OUT/machine.txt"

      - name: Tests and clippy
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      # Full matrix, no filter, no `--quick`. `--quick` collapses the iteration
      # count, which starves the side-channel phase accumulator and produces a
      # breakdown that cannot be compared against bench-results/.
      - name: Benchmark (full matrix)
        run: cargo bench --locked --bench key_stream -- --noplot | tee "$OUT/bench.raw.txt"

      # 60 IDs x 8 phases (create, subscribe, 3 send variants, send_no_receivers,
      # recv, drop). Guards against a filter or variant change silently shrinking
      # coverage while still producing plausible-looking output.
      - name: Extract and check coverage
        run: |
          grep -E ',(phase|FAILED)/?' "$OUT/bench.raw.txt" > "$OUT/phases.csv" || true
          ids=$(grep -c '^full_cycle/' "$OUT/bench.raw.txt" || true)
          rows=$(grep -c ',phase,' "$OUT/bench.raw.txt" || true)
          disc=$(grep -c ',FAILED' "$OUT/bench.raw.txt" || true)
          cols=$(grep ',phase,' "$OUT/bench.raw.txt" | awk -F, '{print NF}' | sort -u | tr '\n' ' ')
          echo "ids=$ids phase_rows=$rows discarded=$disc column_counts=[$cols]"
          [ "$ids" -eq 60 ] || { echo "::error::expected 60 IDs, got $ids"; exit 1; }
          [ "$rows" -eq 480 ] || { echo "::error::expected 480 phase rows, got $rows"; exit 1; }
          [ "$(echo $cols | wc -w)" -eq 1 ] || { echo "::error::ragged CSV: [$cols]"; exit 1; }
          [ "$disc" -eq 0 ] || echo "::warning::$disc discarded-sample rows"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-stream-bench-${{ github.run_id }}
          path: ${{ runner.temp }}/bench
          if-no-files-found: error
          retention-days: 14
