name: Benchmarks

# Cross-architecture check. Local development happens on arm64 (Apple Silicon);
# these runners are x86_64, where atomic costs differ enough to matter for the
# send-variant comparison — x86 has a stronger memory model, so the AcqRel
# traffic in `broadcast::Sender::clone` is relatively cheaper there than on ARM.
#
# READ THE NUMBERS WITH CARE. GitHub runners are shared VMs with noisy
# neighbours; run-to-run spread here is far worse than on a quiet laptop.
# Treat this as confirmation of large, directional effects — the ~5.8 ns
# (~12%) penalty on `clone_sender` versus ~2.0 ns for the wrapped handles.
# It cannot settle `rc_sender` vs `arc_sender`: locally those differ by a mean
# of 0.12 ns over 60 cells, with `arc` ahead in 18 of them. That is a coin flip
# on a quiet machine and will be pure noise here.
#
# Full matrix on every trigger, both feature configurations. This is expensive
# — roughly 15 min per configuration locally — and deliberately so: a filtered
# or `--quick` run produces phase numbers that cannot be compared against the
# local baselines in bench-results/.

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # off = production shape, the numbers Phase 1's decision gate reads.
        # on  = adds Rc/Arc handles for the send-variant comparison; inflates
        #       `subscribe` and `drop` by ~16-18% per key, so it must not be
        #       used for the phase numbers.
        variants: [off, on]
    name: bench (bench-variants=${{ matrix.variants }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Recorded alongside the results: a number without the machine it came
      # from is not comparable to anything.
      - name: Record machine
        run: |
          {
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            echo "nproc=$(nproc)"
            lscpu || true
          } | tee machine.txt

      - name: Feature flags
        id: flags
        run: |
          if [ "${{ matrix.variants }}" = "on" ]; then
            echo "features=--features bench-variants" >> "$GITHUB_OUTPUT"
          else
            echo "features=" >> "$GITHUB_OUTPUT"
          fi

      # Catches feature-gate rot: the cfg'd code must compile and pass in both
      # configurations, not just the one someone last built locally.
      - name: Tests
        run: cargo test --locked ${{ steps.flags.outputs.features }}

      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ steps.flags.outputs.features }} -- -D warnings

      # Always the full matrix: 60 IDs (4 modes x 5 distributions x 3 value
      # types) per feature configuration. Locally that is ~15 min per config on
      # a quiet machine; budget more on a shared runner.
      #
      # Deliberately NOT criterion's `--quick`, and no filter. `--quick`
      # collapses the iteration count, which starves the side-channel phase
      # accumulator and makes the whole breakdown meaningless — the cheap-looking
      # option produces numbers that cannot be compared to anything.
      - name: Run benchmarks (full matrix)
        timeout-minutes: 90
        run: |
          cargo bench --locked --bench key_stream ${{ steps.flags.outputs.features }} \
            -- --noplot | tee bench-output.txt

      # A short cell count guards against a filter or config change silently
      # shrinking coverage: 60 IDs, and 7 phases per ID without the feature
      # (2 send variants) or 9 with it (4 send variants).
      - name: Check coverage
        run: |
          ids=$(grep -c '^full_cycle/' bench-output.txt || true)
          if [ "${{ matrix.variants }}" = "on" ]; then want_rows=540; else want_rows=420; fi
          rows=$(grep -c ',phase,' bench-output.txt || true)
          echo "ids=$ids phase_rows=$rows (want 60 / $want_rows)"
          [ "$ids" -eq 60 ] || { echo "::error::expected 60 benchmark IDs, got $ids"; exit 1; }
          [ "$rows" -eq "$want_rows" ] || { echo "::error::expected $want_rows phase rows, got $rows"; exit 1; }
          discarded=$(grep -c ',FAILED' bench-output.txt || true)
          [ "$discarded" -eq 0 ] || echo "::warning::$discarded discarded-sample rows — see phases.csv"

      # The phase breakdown is emitted on stdout as CSV, not written by
      # criterion, so it has to be pulled out of the log explicitly.
      - name: Extract phase CSV
        run: |
          grep -E ',(phase|FAILED)/?' bench-output.txt > phases.csv || true
          echo "rows: $(wc -l < phases.csv)"
          test -s phases.csv || { echo "::error::no phase rows captured"; exit 1; }

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: key-stream-bench-${{ matrix.variants }}-${{ github.run_id }}
          path: |
            target/criterion
            bench-output.txt
            phases.csv
            machine.txt
          if-no-files-found: error
          retention-days: 14
