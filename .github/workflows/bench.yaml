name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run benchmarks
        env:
          BENCH_MODE: ${{ github.event_name == 'pull_request' && 'quick' || github.event.inputs.mode || 'full' }}
        run: |
          if [ "$BENCH_MODE" = "quick" ]; then
            cargo bench --bench key_stream -- --quick | tee bench-output.txt
          else
            cargo bench --bench key_stream --locked | tee bench-output.txt
          fi
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: key-stream-bench-${{ github.run_id }}
          path: |
            target/criterion
            bench-output.txt
          if-no-files-found: error
          retention-days: 14

  bench-artifact-check:
    runs-on: ubuntu-latest
    needs: bench
    steps:
      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          name: key-stream-bench-${{ github.run_id }}
          path: bench-artifacts
      - name: Show downloaded files
        run: find bench-artifacts -type f | sort
