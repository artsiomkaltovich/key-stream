name: Benchmarks

# Cross-architecture check. Local development happens on arm64 (Apple Silicon);
# these runners are x86_64, where the cost of an atomic RMW is dominated by the
# `lock` prefix rather than by memory ordering.
#
# BOTH FEATURE CONFIGURATIONS RUN IN ONE JOB, SEQUENTIALLY, ON PURPOSE.
# They used to run as a `strategy.matrix`, which put them on different runners —
# and that silently destroyed comparability. Evidence: `send_no_receivers` is
# byte-identical code in both builds and reproduces to 0.01 ns between configs
# on a quiet local machine, but read 23.0 ns and 12.2 ns in two matrix jobs.
# `lock`-op latency varies several-fold across the CPU models in GitHub's pool
# (Intel Xeon vs AMD EPYC, different generations), so numbers from two jobs
# cannot be compared at all. One job, one CPU, or the run answers nothing.
#
# READ THE NUMBERS WITH CARE even so. Shared VMs are noisy; run-to-run spread
# here is far worse than on a quiet laptop. Use `min`, and treat this as
# confirmation of large directional effects rather than a way to resolve
# sub-nanosecond differences.

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Artifacts are written OUTSIDE the checkout. Writing them into the repo
      # made `git status --porcelain` non-empty, so every run self-reported as
      # `-dirty` — inverting the meaning of a marker whose entire job is to warn
      # that the measured code does not match the recorded commit.
      - name: Prepare output dir
        run: echo "OUT=$RUNNER_TEMP/bench" >> "$GITHUB_ENV"

      - name: Record machine
        run: |
          mkdir -p "$OUT"
          {
            echo "runner_os=${{ runner.os }}"
            echo "runner_arch=${{ runner.arch }}"
            echo "nproc=$(nproc)"
            echo "---"
            lscpu || true
          } | tee "$OUT/machine.txt"

      # Both configurations must compile and pass; catches feature-gate rot.
      - name: Tests and clippy (both configs)
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --features bench-variants
          cargo clippy --locked --all-targets --features bench-variants -- -D warnings

      # Full matrix, no filter, no `--quick`. `--quick` collapses the iteration
      # count, which starves the side-channel phase accumulator and produces a
      # breakdown that cannot be compared against the baselines in
      # bench-results/. Order matters: the production-shape run goes first so
      # it sees the least-warmed machine, biasing against the config whose
      # numbers feed Phase 1's decision gate rather than for it.
      - name: Benchmark — production shape (bench-variants off)
        run: cargo bench --locked --bench key_stream -- --noplot | tee "$OUT/off.raw.txt"

      - name: Benchmark — handle comparison (bench-variants on)
        run: |
          cargo bench --locked --features bench-variants --bench key_stream -- --noplot \
            | tee "$OUT/on.raw.txt"

      - name: Extract and check coverage
        run: |
          fail=0
          check() {
            local raw="$1" want_rows="$2" label="$3"
            grep -E ',(phase|FAILED)/?' "$raw" > "${raw%.raw.txt}.phases.csv" || true
            local ids rows disc
            ids=$(grep -c '^full_cycle/' "$raw" || true)
            rows=$(grep -c ',phase,' "$raw" || true)
            disc=$(grep -c ',FAILED' "$raw" || true)
            echo "$label: ids=$ids phase_rows=$rows discarded=$disc (want 60 / $want_rows / 0)"
            [ "$ids" -eq 60 ] || { echo "::error::$label expected 60 IDs, got $ids"; fail=1; }
            [ "$rows" -eq "$want_rows" ] || { echo "::error::$label expected $want_rows phase rows, got $rows"; fail=1; }
            [ "$disc" -eq 0 ] || echo "::warning::$label had $disc discarded-sample rows"
          }
          check "$OUT/off.raw.txt" 420 "off"
          check "$OUT/on.raw.txt"  540 "on"
          exit $fail

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-stream-bench-${{ github.run_id }}
          path: ${{ runner.temp }}/bench
          if-no-files-found: error
          retention-days: 14
